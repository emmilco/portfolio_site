<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Grask</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fdfdfd;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e8e8e8; background: #1a1a1a; }
    }
    h1 { font-weight: 600; margin-top: 0; }
    p, li { margin: 0.5rem 0; }
    ul { padding-left: 1.25rem; list-style: none; }
    li { margin: 0.75rem 0; }
    a { color: #b34700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) { a { color: #ff9959; } }
    .tagline { color: #666; margin-top: -0.5rem; }
    @media (prefers-color-scheme: dark) { .tagline { color: #999; } }
  </style>
</head>
<body>
  <h1>Grask</h1>
  <p class="tagline">Visual task organization for iOS.</p>
  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
    <li><a href="support/">Support</a></li>
  </ul>
</body>
</html>
